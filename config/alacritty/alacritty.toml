[general]
live_config_reload = true
working_directory = "None"

# Colours: under dwl the terminal is started with dwl-theme's generated config, which imports this file and overrides the colours.
# savpavi-theme.toml is a leftover of the removed Hyprland theme tool; it is kept so a plain `alacritty` still has colours
# (alacritty reloads it live). Do not edit that file by hand.
import = [
  "~/.config/alacritty/savpavi-theme.toml",
  "~/.config/alacritty/keybinds.toml"
]

[window]
title = "Alacritty"
decorations = "none"
blur = true
opacity = 0.9
padding.x = 10
padding.y = 10

[window.dimensions]
columns = 100
lines = 30

[cursor.style]
shape= "Beam"
blinking = "Never"

[colors]
#transparent_background_colors = true
draw_bold_text_with_bright_colors = true

[env]
TERM = "xterm-256color"

[font]
#glyph_offset = { x = 1, y = 0 }
normal.family = "MesloLGS Nerd Font Mono"
normal.style = "Regular"
size = 11.0

[font.bold]
family = "MesloLGS Nerd Font Mono"
style = "Bold"

[font.italic]
family = "MesloLGS Nerd Font Mono"
style = "Italic"
