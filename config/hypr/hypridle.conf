# Hyprland 0.55+ Lua config modunda "hyprctl dispatch dpms off" REDDEDILIYOR:
#   error: [string "return hl.dispatch(dpms on)"]:1: ')' expected near 'on'
# Lua sozdizimi sart, yoksa ekran kapatma sessizce calismaz.
#
# 19.08.2026 kara ekran olayi — DPMS listener DEVRE DISI:
# dpms('off') calisiyor ama geri acilis DRM seviyesinde patliyor (amdgpu + aquamarine 0.14):
#   ERR aquamarine: atomic drm request: failed to commit: Invalid argument (ATOMIC_ALLOW_MODESET)
#   ERR aquamarine: drm: crtc 424/428 failed restore
#   kernel: core_link_write_dpcd (DP_LINK_BW_SET) failed
# Bilinen AMD+DPMS sorunu: github.com/hyprwm/hyprlock/issues/953 ve hyprwm/Hyprland/issues/2578.
# Onerilen strateji: dpms off KULLANMA, sadece kilitle. Aquamarine fix'i gelince
# (aquamarine > 0.14.0 / hyprland > 0.56.2 changelog'una bak) alttaki blogu geri ac ve test et.

general {
    lock_cmd = dot-shell lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms('on')"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

