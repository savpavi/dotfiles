# hyprlauncher — ALT+SPACE ile açılan uygulama başlatıcı / seçici.
#
# Renk / font / yuvarlaklık burada DEĞİL: ~/.config/hypr/hyprtoolkit.conf
#   (o dosyayı dot-theme üretir, elle düzenleme — tema değişince yeniden yazılır).
# Bulanıklık + arka plan karartma: hyprland.lua -> "hyprlauncher-blur" layer_rule
#   ve decoration.dim_around.

general {
    # Açılınca klavye odağını al
    grab_focus = true
}

ui {
    # Varsayılan 400x260 idi; 1440p'de fazla küçüktü.
    window_size = 700 450
}

finders {
    # Prefixsiz arama uygulamaları getirir
    default_finder = desktop

    # --- prefixler ---
    # =  hesap makinesi   -> "=  12*1440/60"      sonucu wl-copy ile panoya
    # u: unicode karakter -> "u: arrow"           seçilen karakter panoya
    # #f font seçici      -> "#f jetbrains"       font adı panoya (eskiden "f:" idi; "firefox" yazınca font listesi çıkıyordu)
    math_prefix    = =
    unicode_prefix = u:
    font_prefix    = #f

    # Terminal=true olan .desktop girdileri bu terminalde açılır
    desktop_terminal = ghostty
    desktop_icons = true
}

cache {
    # Sık kullanılan girdiler listede yukarı çıkar
    enabled = true
}
