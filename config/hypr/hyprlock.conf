# Renkler dot-theme tarafından üretiliyor.
source = ~/.config/hypr/hypr-theme.conf

# Yerleşim ve ölçüler elle; renkler hypr-theme.conf üzerinden geliyor.
general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = /home/savpavi/.local/state/dotfiles/theme/background
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    outer_color = $accent
    inner_color = $background
    font_color = $foreground
    check_color = $check_color
    fail_color = $fail_color
    fade_on_empty = false
    placeholder_text = <span foreground="##$muted_hex">Parola</span>
    fail_text = <span foreground="##$fail_hex">Hatalı parola</span>
    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $foreground
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
