# Catppuccin Mocha — Plasma temasiyla ayni palet.
general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = /home/savpavi/Desktop/Ege/Wallpaper/walls-catppuccin-mocha/abstract-swirls.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2eee)
    font_color = rgba(cdd6f4ff)
    check_color = rgba(89b4faff)
    fail_color = rgba(f38ba8ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">Parola</span>
    fail_text = <span foreground="##f38ba8">Hatalı parola</span>
    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a6adc8ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
