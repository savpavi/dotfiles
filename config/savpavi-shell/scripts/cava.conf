# Raw cava output for the bar visualiser: 12 bars, values 0-7, one frame per line.
[general]
bars = 12
framerate = 30
sleep_timer = 2

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
