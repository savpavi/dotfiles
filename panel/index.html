<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1B1A17">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<title>dot-panel</title>
<style>
@font-face { font-family: "JBM"; src: url(/font/regular.ttf); font-weight: 400; }
@font-face { font-family: "JBM"; src: url(/font/bold.ttf); font-weight: 700; }
:root {
  --bg: #1B1A17; --fg: #ECE6D9; --faded: #8A857A; --accent: #D2452D; --on-accent: #fff; --urgent: #2B4C7E;
  --c1: var(--accent); --c2: var(--accent); --c3: var(--accent); --c4: var(--accent);
  --radius: 0px; --gap: 10px;
  --card: color-mix(in srgb, var(--fg) 6%, var(--bg));
  --card-hi: color-mix(in srgb, var(--fg) 11%, var(--bg));
  --line: color-mix(in srgb, var(--fg) 12%, var(--bg));
  --track: color-mix(in srgb, var(--fg) 10%, var(--bg));
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
  font: 400 15px/1.25 "JBM", ui-monospace, monospace; user-select: none; }
body { transition: background .5s, color .5s, opacity 1.2s;
  padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right))
  max(var(--gap), env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left)); }
body::before { content: ""; position: fixed; inset: -20%; pointer-events: none; z-index: -1;
  background: radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 45%),
              radial-gradient(circle at 90% 100%, color-mix(in srgb, var(--c3) 12%, transparent), transparent 45%); }
body.night { opacity: .4; }
.grid { height: 100%; display: grid; gap: var(--gap); transition: transform 2s;
  grid-template-columns: 1fr 1.05fr 1.2fr; grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "clock stats media" "deck deck deck"; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; min-width: 0; min-height: 0; overflow: hidden; position: relative; }
.label { color: var(--faded); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; }
.dim { color: var(--faded); }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }

/* clock + claude */
#clock { grid-area: clock; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
#clock { container-type: inline-size; }
#time { font-size: clamp(40px, 26cqw, 110px); white-space: nowrap; font-weight: 700; line-height: .9; letter-spacing: -.04em;
  font-variant-numeric: tabular-nums; }
#time .sec { font-size: .36em; color: var(--accent); letter-spacing: 0; margin-left: .15em; vertical-align: .95em; }
#date { margin-top: 8px; color: var(--faded); font-size: 14px; }
#date b { color: var(--fg); font-weight: 400; }
.rings { display: flex; flex-direction: column; gap: 10px; }
.ring { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.ring > div { min-width: 0; }
.ring svg { flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring .tr { stroke: var(--track); }
.ring .va { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 157.08; stroke-dashoffset: 157.08; transition: stroke-dashoffset .8s, stroke .4s; }
.ring.hot .va { stroke: var(--urgent); }
.ring .rv { position: relative; flex: none; width: 52px; height: 52px; }
.ring .rv svg { width: 52px; height: 52px; }
.ring .pc { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.ring b { display: block; font-size: 13px; font-weight: 400; color: var(--fg); white-space: nowrap; }
.ring small { display: block; color: var(--faded); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* stats */
#stats { grid-area: stats; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr auto; gap: 8px; padding: 10px; }
.tile { position: relative; background: var(--card-hi); border-radius: max(0px, calc(var(--radius) - 4px));
  padding: 9px 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.tile canvas { display: block; flex: 1; min-height: 0; width: calc(100% + 20px); margin: 6px -10px -9px; }
.tile .top { position: relative; display: flex; justify-content: space-between; align-items: baseline; }
.tile b { position: relative; margin-top: 4px; font-size: 25px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.tile b small { font-size: 13px; font-weight: 400; color: var(--faded); margin-left: 2px; }
.tile .t { font-size: 11px; color: var(--faded); }
.tile .ic { color: var(--c); }
#net { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; padding: 0 2px; }
#net .v { display: flex; gap: 12px; min-width: 0; overflow: hidden; }
#net .v span { white-space: nowrap; }
#net .v i { font-style: normal; color: var(--c4); }

/* media */
#right { grid-area: media; display: flex; flex-direction: column; gap: var(--gap); min-width: 0; min-height: 0; }
#media { flex: none; display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; isolation: isolate; padding: 12px; }
#media::before { content: ""; position: absolute; inset: -30%; z-index: -1; background: var(--art, none) center/cover;
  filter: blur(30px) saturate(1.5); opacity: .4; transition: opacity .6s; }
#media::after { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--bg) 55%, transparent)); }
#art { width: 66px; height: 66px; flex: none; border-radius: max(4px, var(--radius));
  background: var(--track) var(--art, none) center/cover no-repeat; display: grid; place-items: center;
  font-size: 28px; color: var(--faded); box-shadow: 0 6px 18px -8px #000a; }
#art.has { font-size: 0; }
#media.paused #art { filter: saturate(.55) brightness(.85); }
.meta { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
#title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#artist { color: var(--faded); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
#player { font-size: 9.5px; }
.prog { height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.prog i { display: block; height: 100%; width: 0; background: var(--fg); transition: width 1s linear; }
.times { display: none; }
.mrow { grid-column: span 2; display: flex; align-items: center; gap: 10px; }
.transport { display: flex; gap: 4px; align-items: center; }
.transport button { width: 36px; height: 36px; font-size: 18px; border-radius: 50%; background: transparent; border-color: transparent; }
.transport button[data-id="play"] { width: 40px; height: 40px; font-size: 20px; background: var(--fg); color: var(--bg); }
#vol { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--faded); min-width: 0; }
#vol .prog { flex: 1; margin: 0; }
#vol .prog i { background: var(--accent); transition: width .3s; }

/* health */
#health { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; overflow: hidden; min-height: 0; }
#health .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
#nas { font-size: 11.5px; color: var(--faded); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
#nas::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--faded); }
#nas.up::before { background: var(--accent); }
#nas.down { color: var(--urgent); }
#nas.down::before { background: var(--urgent); }
#disks { display: flex; flex-direction: column; justify-content: space-around; flex: 1; gap: 2px; min-height: 0; overflow: hidden; }
.disk { display: grid; grid-template-columns: 78px 1fr 32px; align-items: center; gap: 8px; font-size: 11px; }
.disk .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.disk .n small { color: var(--faded); font-size: 10px; margin-left: 3px; }
.disk .prog { margin: 0; height: 5px; }
.disk .prog i { background: var(--c3); transition: width .6s; }
.disk.full .prog i { background: var(--urgent); }
.disk.warn .n { color: var(--urgent); }
.disk .p { text-align: right; color: var(--faded); font-variant-numeric: tabular-nums; }

/* deck */
#deckwrap { grid-area: deck; display: flex; gap: 8px; min-width: 0; }
#tabs { flex: none; display: grid; grid-template-columns: repeat(2, 34px); grid-auto-rows: 1fr; gap: 4px; }
#tabs button { font-size: 16px; padding: 0; color: var(--faded); }
#tabs button.cur { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
#deck { flex: 1; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
#deck::-webkit-scrollbar { display: none; }
#deck .status { flex: 1.6 0 140px; display: flex; flex-direction: column; justify-content: center; gap: 4px;
  padding: 8px 12px; font-size: 11.5px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
#deck .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--faded); }
#deck .status span.live { color: var(--urgent); }
#rec { position: absolute; top: 12px; right: 12px; display: none; gap: 6px; align-items: center; font-size: 13px;
  color: var(--urgent); }
#rec.show { display: flex; }
#rec::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--urgent); animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .25; } }
button { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); cursor: pointer; transition: transform .1s, background .15s, color .15s; touch-action: manipulation; }
button:active, button.flash { transform: scale(.93); background: var(--accent) !important; color: var(--on-accent) !important; border-color: var(--accent) !important; }
#deck button { flex: 1 0 74px; min-height: 70px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 5px; padding: 8px 4px; }
#deck .ic { font-size: 25px; line-height: 1; }
#deck .tx { font-size: 10.5px; color: var(--faded); white-space: nowrap; }
#deck button:active .tx, #deck button.flash .tx { color: inherit; }
#deck button.app { background: color-mix(in srgb, var(--accent) 12%, var(--card)); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }
#deck button.app .ic { color: var(--accent); }
#deck button.on { border-color: var(--urgent); }
#deck button.on .ic { color: var(--urgent); }

/* theme sheet */
#sheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 92%, transparent); display: none;
  padding: 20px; overflow: auto; z-index: 5; backdrop-filter: blur(8px); }
#sheet.open { display: block; }
#sheet .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 14px; }
#sheet button { padding: 12px; text-align: left; display: flex; gap: 10px; align-items: center; }
#sheet .sw { width: 26px; height: 26px; border-radius: 50%; flex: none; border: 4px solid; }
#sheet button.cur { border-color: var(--accent); }
.pill { padding: 5px 11px; font-size: 12px; border-radius: 999px; white-space: nowrap; flex: none; }

#offline { position: fixed; inset: 0; display: none; place-items: center; text-align: center; z-index: 9;
  background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(6px); }
#offline.show { display: grid; }
#offline b { display: block; font-size: 40px; margin-bottom: 8px; color: var(--accent); }

@media (orientation: portrait) {
  html, body { overflow-y: auto; }
  .grid { height: auto; min-height: 100%; grid-template-columns: 1fr; grid-template-rows: auto;
    grid-template-areas: "clock" "media" "stats" "deck"; }
  #stats { grid-template-rows: 110px 110px auto; }
  #deck { flex-wrap: wrap; overflow: visible; }
  #tabs { grid-template-columns: 34px; }
  #deck button { flex: 1 0 calc(25% - 8px); }
}
</style>
</head>
<body>
<div class="grid" id="grid">
  <section class="card" id="clock">
    <div id="rec"></div>
    <div>
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>
    <div>
      <div class="label" style="margin-bottom:8px">Claude</div>
      <div class="rings">
        <div class="ring" id="q5"><div class="rv"><svg viewBox="0 0 60 60"><circle class="tr" cx="30" cy="30" r="25"/><circle class="va" cx="30" cy="30" r="25"/></svg><span class="pc">–</span></div>
          <div><b>5 saat</b><small class="rs"></small></div></div>
        <div class="ring" id="q7"><div class="rv"><svg viewBox="0 0 60 60"><circle class="tr" cx="30" cy="30" r="25"/><circle class="va" cx="30" cy="30" r="25"/></svg><span class="pc">–</span></div>
          <div><b>7 gün</b><small class="rs"></small></div></div>
      </div>
    </div>
  </section>

  <section class="card" id="stats">
    <div class="tile" style="--c:var(--c1)"><div class="top"><span class="label"><span class="ic">󰻠</span> CPU</span><span class="t" id="cput"></span></div><b id="cpu">–</b><canvas id="g-cpu"></canvas></div>
    <div class="tile" style="--c:var(--c2)"><div class="top"><span class="label"><span class="ic">󰢮</span> GPU</span><span class="t" id="gput"></span></div><b id="gpu">–</b><canvas id="g-gpu"></canvas></div>
    <div class="tile" style="--c:var(--c3)"><div class="top"><span class="label"><span class="ic">󰍛</span> RAM</span><span class="t" id="ramt"></span></div><b id="ram">–</b><canvas id="g-ram"></canvas></div>
    <div class="tile" style="--c:var(--c4)"><div class="top"><span class="label"><span class="ic">󰾲</span> VRAM</span><span class="t" id="vramt"></span></div><b id="vram">–</b><canvas id="g-vram"></canvas></div>
    <div id="net"><div class="v"><span><i>↓</i> <span id="rx">–</span></span><span><i>↑</i> <span id="tx">–</span></span></div>
      <button id="themebtn" class="pill" style="max-width:48%;overflow:hidden;text-overflow:ellipsis">󰏘 <span id="tname"></span></button></div>
  </section>

  <div id="right">
    <section class="card paused" id="media">
      <div id="art">󰝚</div>
      <div class="meta">
        <span class="label" id="player">Çalmıyor</span>
        <div id="title">—</div>
        <div id="artist"></div>
        <div class="prog"><i id="prog"></i></div>
        <div class="times"><span id="pos"></span><span id="len"></span></div>
      </div>
      <div class="mrow">
        <div class="transport" id="transport"></div>
        <div id="vol"><span id="volic">󰕾</span><div class="prog"><i id="volb"></i></div><span id="volt"></span></div>
      </div>
    </section>
    <section class="card" id="health">
      <div class="hd"><span class="label">Depolama</span><span id="nas"></span></div>
      <div id="disks"></div>
    </section>
  </div>

  <div id="deckwrap"><div id="tabs"></div><nav id="deck"></nav></div>
</div>

<div id="sheet"><div class="row"><span class="label">Tema</span><button id="sheetx" class="pill">Kapat</button></div><div class="chips" id="chips"></div></div>
<div id="offline"><div><b>󰌙</b>PC'ye bağlanılamıyor<br><span class="dim" style="font-size:12px">kablo takılınca kendiliğinden bağlanır</span></div></div>

<script>
const $ = (s) => document.querySelector(s);
const DAYS = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
const RING = 2 * Math.PI * 25;
const MEDIA_IDS = ["prev", "play", "next"];
const HIST = 60;
const hist = { cpu: [], gpu: [], ram: [], vram: [] };
let S = null, drift = 0, themeId = null, artKey = null, deckKey = null, posBase = null;

const pad = (n) => String(n).padStart(2, "0");
const gb = (b) => (b / 1073741824).toFixed(1);
const rate = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB/s" : (b / 1024).toFixed(0) + " KB/s";
const mmss = (s) => s == null ? "" : `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
const width = (el, pct) => { el.style.width = Math.max(0, Math.min(100, pct || 0)) + "%"; };
const css = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function until(ts) {
  const s = Math.max(0, ts - (Date.now() / 1000 + drift));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}g ${h}s` : h ? `${h}s ${m}dk` : `${m}dk`;
}

function tick() {
  const n = new Date(Date.now() + drift * 1000);
  $("#time").innerHTML = `${pad(n.getHours())}:${pad(n.getMinutes())}<span class="sec">${pad(n.getSeconds())}</span>`;
  $("#date").innerHTML = `<b>${n.getDate()} ${MONTHS[n.getMonth()]}</b> ${DAYS[n.getDay()]}`;
  document.body.classList.toggle("night", n.getHours() < 7);
  if (S && S.claude) quotas(S.claude);
  if (posBase && S.media && S.media.status === "Playing" && S.media.length) {
    const p = Math.min(S.media.length, posBase.pos + (Date.now() - posBase.at) / 1000);
    width($("#prog"), p / S.media.length * 100); $("#pos").textContent = mmss(p);
  }
}

function applyTheme(t) {
  if (!t || t.id === themeId) return;
  themeId = t.id;
  const r = document.documentElement.style, set = (k, v) => v && r.setProperty(k, v);
  set("--bg", t.bg); set("--fg", t.fg); set("--faded", t.faded); set("--accent", t.accent);
  set("--on-accent", t.onAccent); set("--urgent", t.urgent);
  // Bright terminal colours give each graph its own hue, still from the theme.
  const p = t.palette || [];
  set("--c1", t.accent); set("--c2", p[12] || p[4]); set("--c3", p[14] || p[6]); set("--c4", p[13] || p[5]);
  r.setProperty("--radius", Math.min(t.radius || 0, 16) + "px");
  document.querySelector("meta[name=theme-color]").content = t.bg || "#000";
  $("#tname").textContent = t.name || t.id;
  drawGraphs();
}

function quotas(c) {
  for (const [id, q] of [["#q5", c.five_hour], ["#q7", c.seven_day]]) {
    const el = $(id); if (!q) continue;
    el.querySelector(".pc").textContent = q.used_percentage + "%";
    const va = el.querySelector(".va");
    va.style.strokeDasharray = RING;
    va.style.strokeDashoffset = RING * (1 - Math.min(100, q.used_percentage) / 100);
    el.classList.toggle("hot", q.used_percentage >= 80);
    el.querySelector(".rs").textContent = q.resets_at ? "↻ " + until(q.resets_at) + " sonra" : "";
  }
}

function push(k, v) { if (v == null) return; const h = hist[k]; h.push(v); if (h.length > HIST) h.shift(); }

function graph(id, data, color) {
  const cv = document.getElementById(id); if (!cv) return;
  const w = cv.clientWidth, h = cv.clientHeight, dpr = devicePixelRatio || 1;
  if (!w || !h) return;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  if (data.length < 2) return;
  const step = w / (HIST - 1), x0 = w - (data.length - 1) * step;
  const y = (v) => h - 2 - (Math.min(100, v) / 100) * (h - 4);
  g.beginPath(); g.moveTo(x0, y(data[0]));
  data.forEach((v, i) => { if (i) { const px = x0 + (i - .5) * step; g.bezierCurveTo(px, y(data[i - 1]), px, y(v), x0 + i * step, y(v)); } });
  g.strokeStyle = color; g.lineWidth = 2; g.stroke();
  g.lineTo(w, h); g.lineTo(x0, h); g.closePath();
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + "55"); grad.addColorStop(1, color + "00");
  g.fillStyle = grad; g.fill();
}
function hex(c) { // getComputedStyle may hand back rgb(); the gradient needs #rrggbb
  if (c.startsWith("#") && c.length === 7) return c;
  const m = c.match(/\d+/g); return m ? "#" + m.slice(0, 3).map((n) => (+n).toString(16).padStart(2, "0")).join("") : "#888888";
}
function drawGraphs() {
  graph("g-cpu", hist.cpu, hex(css("--c1"))); graph("g-gpu", hist.gpu, hex(css("--c2")));
  graph("g-ram", hist.ram, hex(css("--c3"))); graph("g-vram", hist.vram, hex(css("--c4")));
}

function stats(s) {
  const unit = (v, u) => v == null ? "–" : `${v}<small>${u}</small>`;
  $("#cpu").innerHTML = unit(s.cpu, "%"); $("#cput").textContent = s.cpu_temp ? s.cpu_temp + "°" : "";
  $("#gpu").innerHTML = unit(s.gpu, "%"); $("#gput").textContent = s.gpu_temp ? s.gpu_temp + "°" : "";
  push("cpu", s.cpu); push("gpu", s.gpu);
  if (s.ram_total) { $("#ram").innerHTML = unit(gb(s.ram_used), "G"); $("#ramt").textContent = "/" + Math.round(s.ram_total / 1073741824) + "G"; push("ram", s.ram_used / s.ram_total * 100); }
  if (s.vram_total) { $("#vram").innerHTML = unit(gb(s.vram_used), "G"); $("#vramt").textContent = "/" + Math.round(s.vram_total / 1073741824) + "G"; push("vram", s.vram_used / s.vram_total * 100); }
  if (s.net_rx != null) { $("#rx").textContent = rate(s.net_rx); $("#tx").textContent = rate(s.net_tx); }
  drawGraphs();
}

function media(m, v) {
  const playing = m && m.status === "Playing";
  $("#media").classList.toggle("paused", !playing);
  $("#player").textContent = m && m.status ? `${m.player} · ${playing ? "çalıyor" : "duraklatıldı"}` : "Çalmıyor";
  $("#title").textContent = (m && m.title) || "—";
  $("#artist").textContent = (m && m.artist) || "";
  $("#len").textContent = m ? mmss(m.length) : "";
  posBase = m && m.position != null ? { pos: m.position, at: Date.now() } : null;
  if (!posBase) { width($("#prog"), 0); $("#pos").textContent = ""; }
  else if (m.length) { width($("#prog"), m.position / m.length * 100); $("#pos").textContent = mmss(m.position); }
  const key = m ? m.art : "";
  if (key !== artKey) {
    artKey = key;
    const url = key ? `url("/api/art?u=${encodeURIComponent(key)}")` : "none";
    $("#media").style.setProperty("--art", url); $("#art").style.setProperty("--art", url);
    $("#art").classList.toggle("has", !!key);
  }
  const pb = $('#transport [data-id="play"]');
  if (pb) pb.textContent = playing ? "󰏤" : "󰐊";
  if (v) {
    width($("#volb"), v.level); $("#volt").textContent = v.level + "%";
    $("#volic").textContent = v.muted ? "󰖁" : v.level > 60 ? "󰕾" : v.level > 20 ? "󰖀" : "󰕿";
  }
}

function button(a, cls) {
  const b = document.createElement("button");
  b.dataset.id = a.id; b.title = a.label || a.id; if (cls) b.className = cls;
  b.addEventListener("click", () => press(a.id, b));
  return b;
}
const PAGES = { ses: ["󰕾", "Ses"], sistem: ["󰒓", "Sistem"], apps: ["󰀻", "Uygulamalar"], meeting: ["󰤙", "Toplantı"] };
let page = null;
try { page = localStorage.getItem("dot-panel-page"); } catch {}

function deck(actions, mic, vol, rec) {
  const key = actions.map((a) => a.id + a.label + a.icon + a.page).join("|") + "#" + page;
  const pages = [...new Set(actions.filter((a) => a.page !== "media").map((a) => a.page || "apps"))]
    .sort((a, b) => (Object.keys(PAGES).indexOf(a) + 99) % 99 - (Object.keys(PAGES).indexOf(b) + 99) % 99);
  if (!pages.includes(page)) page = pages[0];
  if (key.replace(/#.*/, "#" + page) !== deckKey) {
    deckKey = key.replace(/#.*/, "#" + page);
    const tr = $("#transport"), dk = $("#deck"), tb = $("#tabs");
    tr.innerHTML = ""; dk.innerHTML = ""; tb.innerHTML = "";
    for (const pg of pages) {
      const b = document.createElement("button");
      b.textContent = (PAGES[pg] || ["󰘔"])[0]; b.title = (PAGES[pg] || [, pg])[1];
      if (pg === page) b.className = "cur";
      b.addEventListener("click", () => { page = pg; try { localStorage.setItem("dot-panel-page", pg); } catch {} deck(S.actions, S.mic, S.volume, S.rec); });
      tb.append(b);
    }
    if (page === "meeting") { const st = document.createElement("div"); st.className = "status"; st.id = "recstat"; dk.append(st); }
    for (const a of actions) {
      if (MEDIA_IDS.includes(a.id) && a.page === "media") { const b = button(a); b.textContent = a.icon; tr.append(b); continue; }
      if ((a.page || "apps") !== page) continue;
      const b = button(a, page === "apps" ? "app" : "");
      b.innerHTML = `<span class="ic"></span><span class="tx"></span>`;
      b.querySelector(".ic").textContent = a.icon || "•"; b.querySelector(".tx").textContent = a.label || a.id;
      dk.append(b);
    }
  }
  const mb = $('#deck [data-id="mic"]');
  if (mb && mic) { mb.classList.toggle("on", mic.muted); mb.querySelector(".ic").textContent = mic.muted ? "󰍭" : "󰍬"; }
  const sb = $('#deck [data-id="mute"]');
  if (sb && vol) sb.classList.toggle("on", vol.muted);
  recording(rec || { mic: [], cam: [] }, mic);
}

function recording(rec, mic) {
  const live = rec.mic.length || rec.cam.length;
  const r = $("#rec");
  r.classList.toggle("show", !!live);
  r.textContent = [rec.mic.length ? "󰍬" : "", rec.cam.length ? "󰄀" : ""].join(" ");
  const st = $("#recstat");
  if (st) {
    st.innerHTML = "";
    const line = (ic, txt, on) => { const e = document.createElement("span"); e.textContent = `${ic} ${txt}`; if (on) e.className = "live"; st.append(e); };
    line("󰍬", rec.mic.length ? rec.mic.join(", ") : (mic && mic.muted ? "mikrofon kapalı" : "mikrofon boşta"), rec.mic.length);
    line("󰄀", rec.cam.length ? rec.cam.join(", ") : "kamera boşta", rec.cam.length);
  }
}


function health(h) {
  if (!h) return;
  const nas = $("#nas");
  if (h.nas) {
    nas.className = h.nas.online ? "up" : "down";
    nas.textContent = `${h.nas.name} ${h.nas.online ? (h.nas.ms != null ? h.nas.ms + " ms" : "çevrimiçi") : "kapalı"}`;
  } else nas.textContent = "";
  const box = $("#disks"); box.innerHTML = "";
  for (const d of h.disks || []) {
    const row = document.createElement("div");
    row.className = "disk" + (d.pct >= 90 ? " full" : "") + (d.warn ? " warn" : "");
    if (d.warn) row.title = d.warn;
    row.innerHTML = `<span class="n"></span><div class="prog"><i></i></div><span class="p"></span>`;
    row.querySelector(".n").textContent = (d.warn ? "⚠ " : "") + d.name;
    if (d.temp) { const t = document.createElement("small"); t.textContent = d.temp + "°"; row.querySelector(".n").append(t); }
    width(row.querySelector("i"), d.pct);
    row.querySelector(".p").textContent = d.pct + "%";
    box.append(row);
  }
}

async function post(url) {
  try { return (await fetch(url, { method: "POST", headers: { "X-Dot-Panel": "1" } })).ok; } catch { return false; }
}
async function press(id, el) {
  el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 180);
  if (navigator.vibrate) navigator.vibrate(12);
  await post("/api/action/" + encodeURIComponent(id));
  setTimeout(poll, 250);
}

async function poll() {
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    S = await r.json();
    drift = S.now - Date.now() / 1000;
    $("#offline").classList.remove("show");
    applyTheme(S.theme); deck(S.actions || [], S.mic, S.volume, S.rec); stats(S.sys || {}); media(S.media, S.volume); health(S.health);
    if (S.claude) quotas(S.claude);
  } catch { $("#offline").classList.add("show"); }
}

async function openThemes() {
  const list = await (await fetch("/api/themes")).json();
  const c = $("#chips"); c.innerHTML = "";
  for (const t of list) {
    const b = document.createElement("button");
    b.className = t.id === themeId ? "cur" : "";
    b.innerHTML = `<span class="sw"></span><span></span>`;
    b.querySelector(".sw").style.cssText = `background:${t.bg};border-color:${t.accent}`;
    b.lastChild.textContent = t.name;
    b.addEventListener("click", async () => { await post("/api/theme/" + encodeURIComponent(t.id)); $("#sheet").classList.remove("open"); setTimeout(poll, 800); });
    c.append(b);
  }
  $("#sheet").classList.add("open");
}
$("#themebtn").addEventListener("click", openThemes);
$("#sheetx").addEventListener("click", () => $("#sheet").classList.remove("open"));

// The phone's screen is AMOLED: drift the whole layout a few pixels now and then so
// static edges never sit on the same pixels for hours.
function shift() { const r = () => Math.round(Math.random() * 6 - 3); $("#grid").style.transform = `translate(${r()}px, ${r()}px)`; }
setInterval(shift, 90000);

let lock = null;
async function wake() { try { if ("wakeLock" in navigator && document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { wake(); if (document.visibilityState === "visible") poll(); });
document.addEventListener("click", () => { if (!lock || lock.released) wake(); });
addEventListener("resize", drawGraphs);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
wake(); poll(); tick();
setInterval(tick, 1000);
setInterval(poll, 2000);
</script>
